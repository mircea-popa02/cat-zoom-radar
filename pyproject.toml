[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cat-zoom-radar"
version = "0.2.0"
description = "A tiny Storia apartment scout with Jev decisions for cats and video calls"
requires-python = ">=3.10"

[project.scripts]
catzoom = "catzoom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
